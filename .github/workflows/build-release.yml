name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version, for example 0.1.0"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          $knownPaths = @(
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6\ISCC.exe")
          )

          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $installedPath = $knownPaths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1

          if ($null -eq $compiler -and [string]::IsNullOrWhiteSpace($installedPath)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to install Inno Setup."
            }
          }

      - name: Select package version
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          elseif ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and -not [string]::IsNullOrWhiteSpace($env:DISPATCH_VERSION)) {
            $version = $env:DISPATCH_VERSION
          }
          else {
            $version = "0.0.$env:GITHUB_RUN_NUMBER"
          }

          if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            throw "Invalid version '$version'. Use a value such as 0.1.0 or a tag such as v0.1.0."
          }

          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Version $env:RELEASE_VERSION

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockGame-Windows-${{ github.run_number }}
          path: |
            artifacts/release/BlockGame-Setup.exe
            artifacts/release/BlockGame-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: BlockGame-Windows-${{ github.run_number }}
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              release/BlockGame-Setup.exe \
              release/BlockGame-Setup.exe.sha256 \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release/BlockGame-Setup.exe \
              release/BlockGame-Setup.exe.sha256 \
              --title "BlockGame $GITHUB_REF_NAME" \
              --generate-notes
          fi
